<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reCAPTCHA Verification</title>
<style>
    :root{
        --accent:#ff5fb2;
        --accent-dim:#c93b87;
        --bg:#150a11;
        --bg2:#1f0f19;
        --card:#261320;
        --text:#ffeef7;
        --muted:#c090ab;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
        font-family:'Segoe UI',system-ui,sans-serif;
        background:var(--bg);
        color:var(--text);
        display:flex;
        flex-direction:column;
        min-height:100vh;
    }
    header{ padding:16px 20px; background:var(--bg2); border-bottom:1px solid rgba(255,95,178,.15); }
    header h1{ font-size:1rem; color:var(--accent); }
    header p{ font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

    main{ flex:1; padding:26px 20px; display:flex; flex-direction:column; gap:18px; justify-content:center; }

    .login-card{ background:var(--card); border-radius:18px; padding:22px; border:1px solid rgba(255,95,178,.15); }
    .login-card h2{ font-size:.95rem; margin-bottom:16px; color:var(--text); }
    .field{
        width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,95,178,.2);
        background:var(--bg2); color:var(--text); margin-bottom:12px; font-size:.85rem;
    }

    .captcha-box{
        padding:14px 16px; border-radius:12px;
        border:1px solid rgba(255,95,178,.25); background:var(--bg2); margin:14px 0;
    }
    .captcha-row{ display:flex; align-items:center; gap:12px; min-width:0; }
    .checkbox{
        width:24px; height:24px; border-radius:6px; border:2px solid var(--muted); flex-shrink:0;
        display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; position:relative;
    }
    .checkbox.loading{ border-color:var(--accent); }
    .checkbox.verified{ background:var(--accent); border-color:var(--accent); }
    .checkbox svg{ width:14px; height:14px; opacity:0; transition:.2s; }
    .checkbox.verified svg{ opacity:1; }
    .spinner{
        width:14px; height:14px; border:2px solid rgba(255,95,178,.3); border-top-color:var(--accent);
        border-radius:50%; opacity:0; position:absolute; animation:spin .7s linear infinite;
    }
    .checkbox.loading .spinner{ opacity:1; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .captcha-label{ font-size:.8rem; flex:1; min-width:0; word-break:break-word; }
    .captcha-brand{ font-size:.6rem; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,95,178,.12); }

    .shield{ font-size:.7rem; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .shield svg{ width:14px; height:14px; color:var(--accent); }

    .signin-btn{
        width:100%; padding:14px; border:none; border-radius:12px; background:rgba(255,95,178,.15);
        color:var(--muted); font-weight:600; font-size:.9rem; cursor:pointer; transition:.2s;
    }
    .signin-btn.ready{ background:var(--accent); color:#2a0a1c; }
    .signin-btn.shake{ animation:shake .4s; }
    @keyframes shake{ 20%,60%{ transform:translateX(-6px); } 40%,80%{ transform:translateX(6px); } }

    .status-msg{ text-align:center; font-size:.78rem; margin-top:12px; min-height:16px; }
    .status-msg.warn{ color:#ff9d9d; }
    .status-msg.success{ color:var(--accent); }
    footer{ padding:12px 20px; text-align:center; color:var(--muted); font-size:.7rem; background:var(--bg2); }
</style>
</head>
<body>

<header>
    <h1>Campus Portal — Secure Login</h1>
    <p>Java · reCAPTCHA API</p>
</header>

<main>
    <div class="login-card">
        <h2>Student &amp; Staff Sign In</h2>
        <input class="field" placeholder="Student / Staff ID" disabled>
        <input class="field" placeholder="Password" type="password" disabled>

        <div class="captcha-box">
            <div class="captcha-row">
                <div class="checkbox" id="checkbox">
                    <div class="spinner"></div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="#2a0a1c" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
                </div>
                <div class="captcha-label">I'm not a robot</div>
            </div>
            <div class="captcha-brand">reCAPTCHA · Privacy · Terms</div>
        </div>

        <div class="shield">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
            Bot &amp; automated-access protection active
        </div>

        <button class="signin-btn" id="signinBtn" style="margin-top:16px;">Sign In</button>
        <div class="status-msg" id="statusMsg">&nbsp;</div>
    </div>
</main>

<footer>Demo build — simulated verification, no data submitted</footer>

<script>
    const checkbox = document.getElementById('checkbox');
    const signinBtn = document.getElementById('signinBtn');
    const statusMsg = document.getElementById('statusMsg');
    let verified = false;
    let verifying = false;

    checkbox.addEventListener('click', () => {
        if (verified || verifying) return;
        verifying = true;
        checkbox.classList.add('loading');
        statusMsg.textContent = 'Verifying...';
        statusMsg.className = 'status-msg';

        setTimeout(() => {
            verifying = false;
            verified = true;
            checkbox.classList.remove('loading');
            checkbox.classList.add('verified');
            signinBtn.classList.add('ready');
            statusMsg.textContent = 'Verification passed — you may sign in';
            statusMsg.className = 'status-msg success';
        }, 1100);
    });

    signinBtn.addEventListener('click', () => {
        if (!verified){
            signinBtn.classList.add('shake');
            statusMsg.textContent = 'Please complete the verification above';
            statusMsg.className = 'status-msg warn';
            setTimeout(() => signinBtn.classList.remove('shake'), 400);
            return;
        }
        statusMsg.textContent = 'Access granted — bot protection passed ✓';
        statusMsg.className = 'status-msg success';
    });
</script>

</body>
</html>
